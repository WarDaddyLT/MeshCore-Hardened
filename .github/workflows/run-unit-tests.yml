name: Run Unit Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Run Unit Tests
        run: pio test -e native -e native_kiss_modem -e native_savemesh -e native_savemesh_prefs -e native_hardened -vv

      - name: Upload Test Results
        # Upload test results even if the test step failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pio/build/native/
            .pio/build/native_kiss_modem/
            .pio/build/native_savemesh/
            .pio/build/native_savemesh_prefs/
            .pio/build/native_hardened/
